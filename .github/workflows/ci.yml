name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC — catches upstream dataset/model drift

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-train.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-train.txt

      - name: Run tests
        run: python -m pytest -q

  smoke:
    name: End-to-end smoke run
    # Downloads the dataset and base model from the Hub, so it is kept off the
    # every-push path: run it on demand, and weekly to catch upstream drift.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-train.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-train.txt

      - name: Train, evaluate and gate on a tiny subsample
        run: |
          python -m bsa.train --config configs/train.yaml \
            -o experiment_name=ci-smoke \
            -o data.subsample=48 \
            -o training.epochs=1 \
            -o log_model_artifact=false
