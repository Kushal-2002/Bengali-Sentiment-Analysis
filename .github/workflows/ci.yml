name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC — catches upstream dataset/model drift

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-train.txt
            requirements-serve.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-train.txt -r requirements-serve.txt

      - name: Run tests
        run: python -m pytest -q

  docker:
    name: Build inference image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: bengali-sentiment:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot the container and check /health
        # BSA_SKIP_MODEL_LOAD skips the weight download: this job proves the image
        # builds and serves, not that the Hub is reachable.
        run: |
          docker run -d --name api -p 8000:8000 -e BSA_SKIP_MODEL_LOAD=1 bengali-sentiment:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo "health ok"; docker rm -f api; exit 0
            fi
            sleep 2
          done
          echo "service did not become healthy"; docker logs api; docker rm -f api; exit 1

  smoke:
    name: End-to-end smoke run
    # Downloads the dataset and base model from the Hub, so it is kept off the
    # every-push path: run it on demand, and weekly to catch upstream drift.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-train.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-train.txt

      - name: Train, evaluate and gate on a tiny subsample
        run: |
          python -m bsa.train --config configs/train.yaml \
            -o experiment_name=ci-smoke \
            -o data.subsample=48 \
            -o training.epochs=1 \
            -o log_model_artifact=false
